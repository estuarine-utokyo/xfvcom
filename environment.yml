name: xfvcom
channels:
  - conda-forge
dependencies:
  # ── Python runtime ──────────────────────────────────────────────
  - python=3.13.*

  # ── xfvcom core dependencies ────────────────────────────────────
  - numpy
  - pandas
  - xarray
  - scipy
  - scikit-learn
  - matplotlib
  - cartopy
  - pyproj
  - netcdf4
  - cftime
  - h5netcdf
  - imageio
  - imageio-ffmpeg
  - moviepy
  - tqdm
  - jinja2
  - pyyaml
  - chardet
  - pvlib  # Solar radiation estimation for gap filling

  # ── MPI parallel computing ──────────────────────────────────────
  # Default backend is mpich. For Intel MPI on supercomputers:
  #   mamba install "mpi=*=impi"
  - mpi4py

  # ── Parallel / big-data computing ───────────────────────────────
  - dask
  - distributed
  - numba
  - zarr

  # ── Interactive visualization ───────────────────────────────────
  - hvplot
  - bokeh
  - holoviews
  - geoviews
  - panel
  - datashader
  - colorcet
  - plotly
  - ipywidgets

  # ── Geospatial ──────────────────────────────────────────────────
  # NOTE: The coastmask feature has moved to the standalone 'xcoast'
  #       package (https://github.com/estuarine-utokyo/xcoast).
  #       Install it separately if you need 'xfvcom.coastmask' (a
  #       deprecation shim) or want to use xcoast directly:
  #
  #           pip install git+https://github.com/estuarine-utokyo/xcoast.git
  #
  #       xcoast brings in geopandas, shapely, and pyogrio transitively.

  # ── NetCDF / climate tools ──────────────────────────────────────
  - nctoolkit  # Includes nco, cdo as dependencies
  - metpy

  # ── File I/O ────────────────────────────────────────────────────
  - openpyxl
  - xlsxwriter
  - python-pptx
  - lxml
  - beautifulsoup4

  # ── Optimization ────────────────────────────────────────────────
  - optuna

  # ── Development tools ───────────────────────────────────────────
  - pytest
  - mypy
  - black
  - isort
  - ruff
  - ipykernel
  - jupyterlab

  # ── Type stubs for mypy ─────────────────────────────────────────
  - types-pyyaml
  - pandas-stubs

  # ── Pip dependencies ────────────────────────────────────────────
  - pip
  - pip:
      - -e .  # Install xfvcom in editable mode
