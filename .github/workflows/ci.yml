# .github/workflows/ci.yml
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1) Check-out repository
      - uses: actions/checkout@v4

      # 2) System libraries required by Cartopy / PROJ / GEOS
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libproj-dev proj-data proj-bin \
            libgeos-dev

      # 3) Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 4) Install Python dependencies (runtime + dev extras)
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
          # xcoast hosts the OSM land-mask feature formerly known as
          # xfvcom.coastmask. The xfvcom.coastmask shim re-exports it,
          # and the test_import_graph test imports the shim, so xcoast
          # must be present in CI.
          pip install git+https://github.com/estuarine-utokyo/xcoast.git

      # 5) Code formatting (black)
      - name: Code formatting check
        run: black --check .

      # 6) Import sorting (isort)
      - name: Import sorting check
        run: isort --check-only .

      # 7) Static type checking (mypy)
      - name: Static type checking
        run: mypy .

      # 8) (NEW) Restore baseline PNGs for image regression
      - name: Restore baseline PNGs
        uses: actions/cache/restore@v4
        with:
          path: tests/baseline
          key: baseline-v1

      # 9) Unit tests (pytest) – skip image-regression tests on CI
      - name: Run unit tests (no-PNG)
        env:
          MPLBACKEND: Agg
        run: |
          # Skip tests marked with "png" to avoid flaky image-comparison in CI
          pytest -q -m "not png"
