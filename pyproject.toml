# pyproject.toml  ── fully valid TOML 1.0
#
# NOTE: mamba (environment.yml) is the recommended installation method.
#       pip is supported but not recommended — use only for packages
#       unavailable on conda-forge.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xfvcom"
version = "0.2.0"
description = "Visualisation utilities for FVCOM outputs"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Jun Sasaki", email = "jsasaki.ece@gmail.com" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy>=2.1.0",
  "xarray>=2024.6.0",
  "pandas>=2.2.0",
  "matplotlib>=3.9.0",
  "cartopy>=0.24.0",
  "pyproj>=3.6.0",
  "scipy>=1.14.0",
  "scikit-learn>=1.5.0",
  "imageio>=2.34.0",
  "moviepy>=1.0.3",
  "imageio-ffmpeg>=0.6.0",
  "tqdm>=4.66.0",
  "jinja2>=3.1.4",
  "PyYAML>=6.0.1",
  "netCDF4>=1.7.0",
  "h5netcdf>=1.2.0",
  "cftime>=1.6.4",
  "chardet>=5.2.0",
  "pvlib>=0.10.0",
]

# Optional: install the standalone xcoast package to enable the
# `xfvcom.coastmask` deprecation shim and the OSM-derived land mask
# features (now maintained at https://github.com/estuarine-utokyo/xcoast).

[project.optional-dependencies]
interactive = ["hvplot>=0.10.0", "bokeh>=3.4.0", "holoviews>=1.19.0"]
dev = [
  "pytest>=8.3.0",
  "mypy>=1.10.0",
  "black>=24.8.0",
  "isort>=6.0.0",
  "types-tqdm>=4.66.0",
  "pandas-stubs>=3.0.0",
  "types-PyYAML>=6.0.12",
  "ruff>=0.5.0",
  "ipykernel>=6.29.0",
  "jupyterlab>=4.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xfvcom*"]

[tool.setuptools.package-data]
xfvcom = ["data/*.yaml", "data/*.yml"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
skip_glob = ["**/.ipynb_checkpoints/*"]

[tool.mypy]
strict = true
strict_optional = true
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[project.scripts]
xfvcom-make-river-nml = "xfvcom.cli.make_river_nml:main"
xfvcom-make-river-nc = "xfvcom.cli.make_river_nc:main"
xfvcom-make-met-nc = "xfvcom.cli.make_met_nc:main"
xfvcom-make-met-nc-from-metforce = "xfvcom.cli.make_met_nc_from_metforce:main"
xfvcom-make-groundwater-nc = "xfvcom.cli.make_groundwater_nc:main"
xfvcom-dye-ts = "xfvcom.cli.dye_timeseries:main"
xfvcom-check-met = "xfvcom.cli.check_met_nc:main"
xfvcom-calc-gwo-corr = "xfvcom.cli.calc_gwo_correlation:main"
